stages:
  - lint
  - build
  - test
  - benchmark

variables:
  PYTHON_VERSION: "3.12"

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y clang lld python3 python3-pip python3-venv ninja-build git
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install pytest numpy ipykernel

lint-and-docs:
  stage: lint
  script:
    - . .venv/bin/activate
    - python3 src/doc_manager.py --check
    - python3 src/doc_manager.py --test

test-suite:
  stage: test
  script:
    - . .venv/bin/activate
    - python3 tests/test_golden.py
    - pytest tests/test_bilingual_diagnostics.py
    - python3 src/learn.py test-all

crater-smoke:
  stage: test
  script:
    - . .venv/bin/activate
    - python3 veloc.py crater --smoke
